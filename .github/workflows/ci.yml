name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test SVG export
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Check Cloudflare Worker bundle
        run: npm run worker:check
